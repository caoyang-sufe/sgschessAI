<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自走棋录像回放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0d5c0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #2a3a5e;
        }
        .header h1 {
            font-size: 24px;
            color: #f0d5a0;
        }
        .header .info {
            font-size: 14px;
            color: #8a9bb5;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: #1a2744;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .controls button:hover {
            transform: scale(1.05);
        }
        .btn-play { background: #4ade80; color: #052e16; }
        .btn-pause { background: #fbbf24; color: #451a03; }
        .btn-stop { background: #f87171; color: #450a0a; }
        .btn-prev { background: #60a5fa; color: #172554; }
        .btn-next { background: #60a5fa; color: #172554; }
        .controls .step-info {
            font-size: 16px;
            color: #c8bda8;
            min-width: 140px;
            text-align: center;
        }
        .controls .progress-bar {
            flex: 1;
            min-width: 200px;
            height: 6px;
            background: #2a3a5e;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }
        .controls .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .controls .progress-bar .thumb {
            position: absolute;
            top: -6px;
            width: 16px;
            height: 16px;
            background: #c084fc;
            border-radius: 50%;
            transform: translateX(-50%);
            transition: left 0.1s;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .panel {
            background: #1a2744;
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid #2a3a5e;
            min-height: 200px;
        }
        .panel .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #8a9bb5;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel .panel-title .badge {
            background: #2a3a5e;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #a8b8d0;
        }
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 100px;
            align-items: flex-start;
        }
        .card-item {
            width: 72px;
            text-align: center;
            background: #0f1a2e;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid #2a3a5e;
            transition: all 0.2s;
            position: relative;
        }
        .card-item:hover {
            border-color: #60a5fa;
            transform: translateY(-2px);
        }
        .card-item img {
            width: 64px;
            height: 88px;
            object-fit: contain;
            border-radius: 4px;
            background: #0a1220;
            display: block;
            margin: 0 auto;
        }
        .card-item .card-name {
            font-size: 10px;
            color: #a8b8d0;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 64px;
        }
        .card-item .card-id {
            font-size: 8px;
            color: #5a6a85;
            position: absolute;
            top: 2px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            padding: 0 4px;
            border-radius: 3px;
        }
        .card-item .card-rank {
            position: absolute;
            bottom: 16px;
            left: 4px;
            font-size: 10px;
            color: #fbbf24;
            background: rgba(0,0,0,0.6);
            padding: 0 4px;
            border-radius: 3px;
        }
        .card-item .card-stats {
            font-size: 8px;
            color: #6a8a9a;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .card-item .card-stats span { background: #0a1220; padding: 0 4px; border-radius: 2px; }
        .card-empty {
            color: #3a4a5e;
            font-size: 13px;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        .action-panel {
            background: #1a2744;
            border-radius: 10px;
            padding: 14px 20px;
            border: 1px solid #2a3a5e;
            margin-top: 4px;
        }
        .action-panel .action-label {
            font-size: 13px;
            color: #8a9bb5;
        }
        .action-panel .action-desc {
            font-size: 18px;
            font-weight: bold;
            color: #f0d5a0;
            margin-top: 4px;
        }
        .action-panel .action-details {
            font-size: 13px;
            color: #a8b8d0;
            margin-top: 4px;
            font-family: monospace;
        }
        .action-type-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-refresh { background: #3b82f6; color: #fff; }
        .badge-levelUp { background: #8b5cf6; color: #fff; }
        .badge-buy { background: #22c55e; color: #fff; }
        .badge-sell { background: #ef4444; color: #fff; }
        .badge-lineup { background: #f59e0b; color: #fff; }
        .badge-useSpell { background: #ec4899; color: #fff; }
        .badge-lock { background: #6b7280; color: #fff; }
        .badge-followUp { background: #14b8a6; color: #fff; }
        .badge-init { background: #64748b; color: #fff; }
        .badge-gameOver { background: #dc2626; color: #fff; }

        .status-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 8px 0;
            font-size: 13px;
            color: #8a9bb5;
            border-top: 1px solid #1a2744;
            margin-top: 8px;
        }
        .status-bar .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-bar .stat .val {
            color: #f0d5a0;
            font-weight: bold;
        }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 700px) {
            .main-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .step-info { text-align: center; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f1a2e; }
        ::-webkit-scrollbar-thumb { background: #3a4a6e; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a6a8e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>♟ 自走棋录像回放</h1>
            <div class="info" id="fileInfo">未加载数据</div>
        </div>

        <!-- 控制栏 -->
        <div class="controls">
            <button class="btn-prev" onclick="prevStep()">◀ 上一步</button>
            <button id="playBtn" class="btn-play" onclick="togglePlay()">▶ 播放</button>
            <button class="btn-next" onclick="nextStep()">下一步 ▶</button>
            <button class="btn-stop" onclick="resetPlay()">⏹ 重置</button>
            <span class="step-info" id="stepInfo">步骤 0 / 0</span>
            <div class="progress-bar" id="progressBar" onclick="clickProgress(event)">
                <div class="fill" id="progressFill"></div>
                <div class="thumb" id="progressThumb"></div>
            </div>
            <div style="font-size:13px;color:#6a7a95;">
                <label>速度: <select id="speedSelect" onchange="setSpeed(this.value)">
                    <option value="500">1x</option>
                    <option value="300">2x</option>
                    <option value="150">4x</option>
                    <option value="70">8x</option>
                </select></label>
            </div>
        </div>

        <!-- 主区域 -->
        <div class="main-grid">
            <!-- 商店区 -->
            <div class="panel">
                <div class="panel-title">
                    🏪 商店区
                    <span class="badge" id="shopCount">0 张</span>
                </div>
                <div class="card-grid" id="shopGrid"></div>
            </div>
            <!-- 手牌区 -->
            <div class="panel">
                <div class="panel-title">
                    🃏 手牌区
                    <span class="badge" id="handCount">0 张</span>
                </div>
                <div class="card-grid" id="handGrid"></div>
            </div>
            <!-- 上阵区 -->
            <div class="panel">
                <div class="panel-title">
                    ⚔️ 上阵区
                    <span class="badge" id="lineupCount">0 张</span>
                </div>
                <div class="card-grid" id="lineupGrid"></div>
            </div>
        </div>

        <!-- 动作信息 -->
        <div class="action-panel">
            <div class="action-label">📋 当前操作</div>
            <div class="action-desc" id="actionDesc">等待开始...</div>
            <div class="action-details" id="actionDetails"></div>
            <div class="status-bar">
                <span class="stat">💰 金币: <span class="val" id="statMoney">0</span></span>
                <span class="stat">🏰 营帐等级: <span class="val" id="statLevel">0</span></span>
                <span class="stat">❤️ 血量: <span class="val" id="statHp">0</span></span>
                <span class="stat">🔄 刷新消耗: <span class="val" id="statRefreshCost">0</span></span>
                <span class="stat">📈 升级消耗: <span class="val" id="statLevelCost">0</span></span>
                <span class="stat">🔒 锁定: <span class="val" id="statLock">否</span></span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 数据加载与状态管理
        // ============================================================

        let jsonData = null;
        let trajectory = [];
        let currentStep = 0;
        let isPlaying = false;
        let playTimer = null;
        let playSpeed = 500; // ms

        // 动作类型颜色映射
        const actionColors = {
            'refresh': 'badge-refresh',
            'levelUp': 'badge-levelUp',
            'buy': 'badge-buy',
            'sell': 'badge-sell',
            'lineup': 'badge-lineup',
            'useSpell': 'badge-useSpell',
            'lock': 'badge-lock',
            'followUp': 'badge-followUp',
            'init': 'badge-init',
            'gameOver': 'badge-gameOver'
        };

        const actionLabels = {
            'refresh': '🔄 刷新商店',
            'levelUp': '⬆️ 升级营帐',
            'buy': '🛒 购买卡牌',
            'sell': '💰 遣散卡牌',
            'lineup': '⚔️ 上阵卡牌',
            'useSpell': '✨ 使用锦囊',
            'lock': '🔒 锁定商店',
            'followUp': '🔗 随征',
            'init': '🎯 初始化',
            'gameOver': '🏁 游戏结束'
        };

        // ============================================================
        // 核心功能
        // ============================================================

        function loadData(jsonText) {
            try {
                jsonData = JSON.parse(jsonText);
                trajectory = jsonData.trajectory || [];
                currentStep = 0;
                document.getElementById('fileInfo').textContent =
                    `📊 共 ${trajectory.length} 步 | ${Object.keys(jsonData.rounds || {}).length} 回合 | 分段 ${jsonData.metadata?.segmentId || 1}`;
                renderStep(0);
                updateProgress();
                if (trajectory.length === 0) {
                    document.getElementById('actionDesc').textContent = '⚠️ 没有轨迹数据';
                } else {
                    document.getElementById('actionDesc').textContent = '✅ 数据加载成功，点击播放查看';
                }
            } catch (e) {
                console.error('数据解析失败:', e);
                document.getElementById('actionDesc').textContent = '❌ 数据解析失败: ' + e.message;
                document.getElementById('fileInfo').textContent = '❌ 数据加载失败';
            }
        }

        function renderStep(index) {
            if (!trajectory || trajectory.length === 0) {
                showEmptyState();
                return;
            }

            const step = trajectory[index];
            if (!step) return;

            const state = step.stateBefore || {};
            const afterState = step.stateAfter || {};
            const action = step.type || 'unknown';
            const details = step.details || {};

            // 更新状态显示（优先使用 afterState，否则用 stateBefore）
            const displayState = afterState || state;

            // 渲染各区
            renderShop(displayState.shopGoods || []);
            renderHand(displayState.handChess || []);
            renderLineup(displayState.lineup || []);

            // 更新统计
            document.getElementById('shopCount').textContent = (displayState.shopGoods || []).length + ' 张';
            document.getElementById('handCount').textContent = (displayState.handChess || []).length + ' 张';
            document.getElementById('lineupCount').textContent = (displayState.lineup || []).length + ' 张';

            // 更新状态栏
            document.getElementById('statMoney').textContent = displayState.money ?? '?';
            document.getElementById('statLevel').textContent = displayState.shopLevel ?? '?';
            document.getElementById('statHp').textContent = displayState.hp ?? '?';
            document.getElementById('statRefreshCost').textContent = displayState.shopRefreshCost ?? '?';
            document.getElementById('statLevelCost').textContent = displayState.shopLevelUpCost ?? '?';
            document.getElementById('statLock').textContent = displayState.shopLock ? '是' : '否';

            // 更新步骤信息
            const round = step.round ?? '?';
            document.getElementById('stepInfo').textContent =
                `步骤 ${index + 1} / ${trajectory.length} | 回合 ${round}`;

            // 更新动作描述
            const actionLabel = actionLabels[action] || action;
            const badgeClass = actionColors[action] || 'badge-refresh';
            const timeStr = step.time ? new Date(step.time).toLocaleTimeString() : '';

            let detailText = '';
            if (action === 'buy') {
                detailText = `购买: 卡牌ID ${details.goodsID || '?'}, 位置 ${details.slotIndex ?? '?'}, 消耗 ${details.cost ?? '?'} 金币`;
            } else if (action === 'sell') {
                detailText = `遣散: 卡牌ID ${details.goodsID || '?'}, 随征: ${details.isFollowUp ? '是' : '否'}`;
            } else if (action === 'refresh') {
                detailText = `刷新商店, 消耗 ${details.cost ?? '?'} 金币, ${details.isAuto ? '自动' : '手动'}`;
            } else if (action === 'levelUp') {
                detailText = `升级营帐, 消耗 ${details.cost ?? '?'} 金币, 新等级 ${details.newLevel ?? '?'}`;
            } else if (action === 'lineup') {
                const changes = details.changes || [];
                detailText = `上阵调整: ${changes.length} 个位置变化` +
                    changes.map(c => `[${c.position}] ${c.oldGoodsID || '空'}→${c.newGoodsID || '空'}`).join(' ');
            } else if (action === 'useSpell') {
                detailText = `使用锦囊: ID ${details.goodsID || '?'}, 目标 ${(details.targets || []).join(', ') || '无'}`;
            } else if (action === 'followUp') {
                detailText = `随征: 目标 ${details.targetGoodsID || '?'}, 随征卡 ${details.followUpGoodsID || '?'}`;
            } else if (action === 'lock') {
                detailText = `锁定状态: ${details.newState !== undefined ? (details.newState ? '锁定' : '解锁') : '切换'}`;
            } else {
                detailText = JSON.stringify(details);
            }

            document.getElementById('actionDesc').innerHTML =
                `<span class="action-type-badge ${badgeClass}">${actionLabel}</span> ${timeStr}`;
            document.getElementById('actionDetails').textContent = detailText;
        }

        // ============================================================
        // 渲染函数
        // ============================================================

        function renderShop(goods) {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            if (!goods || goods.length === 0) {
                grid.innerHTML = '<div class="card-empty">🛒 商店为空</div>';
                return;
            }
            goods.forEach((item, idx) => {
                if (!item || !item.chessID && !item.spellID) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'card-item';
                    emptyDiv.style.opacity = '0.3';
                    emptyDiv.innerHTML = `<div style="padding:20px 0;font-size:12px;color:#3a4a5e;">空位</div>`;
                    grid.appendChild(emptyDiv);
                    return;
                }
                const div = createCardElement(item, idx);
                grid.appendChild(div);
            });
        }

        function renderHand(cards) {
            const grid = document.getElementById('handGrid');
            grid.innerHTML = '';
            if (!cards || cards.length === 0) {
                grid.innerHTML = '<div class="card-empty">🃏 手牌为空</div>';
                return;
            }
            cards.forEach((item, idx) => {
                const div = createCardElement(item, idx);
                grid.appendChild(div);
            });
        }

        function renderLineup(chesses) {
            const grid = document.getElementById('lineupGrid');
            grid.innerHTML = '';
            if (!chesses || chesses.length === 0) {
                grid.innerHTML = '<div class="card-empty">⚔️ 上阵区为空</div>';
                return;
            }
            chesses.forEach((item, idx) => {
                const div = createCardElement(item, idx);
                // 添加位置标记
                const posTag = document.createElement('div');
                posTag.style.cssText =
                    'position:absolute;top:2px;left:4px;font-size:9px;color:#6a8a9a;background:rgba(0,0,0,0.5);padding:0 4px;border-radius:3px;';
                posTag.textContent = `#${idx + 1}`;
                div.appendChild(posTag);
                grid.appendChild(div);
            });
        }

        function createCardElement(item, idx) {
            const div = document.createElement('div');
            div.className = 'card-item';

            const chessId = item.chessID || item.cardID || 0;
            const spellId = item.spellID || 0;
            const isSpell = item.isSpell || (spellId > 0 && !chessId);
            const cardId = isSpell ? spellId : chessId;

            // 图片
            const img = document.createElement('img');
            const filename = isSpell ? `spell_${spellId}` : `card_${chessId}`;
            // 尝试加载图片，如果不存在则显示占位
            img.src = `assets/card/${chessId || spellId}.png`;
            img.onerror = function() {
                this.src = '';
                this.alt = isSpell ? `锦囊${spellId}` : `棋子${chessId}`;
                this.style.background = '#1a2744';
                this.style.display = 'flex';
                this.style.alignItems = 'center';
                this.style.justifyContent = 'center';
                this.style.fontSize = '10px';
                this.style.color = '#5a6a85';
                // 显示ID作为备选
                const parent = this.parentElement;
                const label = document.createElement('div');
                label.style.cssText =
                    'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#5a6a85;text-align:center;';
                label.textContent = isSpell ? `📜${spellId}` : `♟${chessId}`;
                parent.appendChild(label);
            };
            div.appendChild(img);

            // ID标签
            const idLabel = document.createElement('span');
            idLabel.className = 'card-id';
            idLabel.textContent = isSpell ? `S${spellId}` : `C${chessId}`;
            div.appendChild(idLabel);

            // 名称（如果有）
            const name = item.name || (isSpell ? `锦囊` : `棋子`);
            const nameDiv = document.createElement('div');
            nameDiv.className = 'card-name';
            nameDiv.textContent = name.length > 6 ? name.slice(0, 6) + '..' : name;
            div.appendChild(nameDiv);

            // 等级/星级
            if (item.rank || item.rank === 0) {
                const rankDiv = document.createElement('div');
                rankDiv.className = 'card-rank';
                const starCount = Math.min(Math.max(item.rank || 1, 1), 6);
                rankDiv.textContent = '⭐'.repeat(Math.min(starCount, 3));
                div.appendChild(rankDiv);
            }

            // 属性（攻击/血量）
            if (!isSpell && (item.attack || item.hp)) {
                const stats = document.createElement('div');
                stats.className = 'card-stats';
                stats.innerHTML = `<span>⚔${item.attack || 0}</span><span>❤${item.hp || 0}</span>`;
                div.appendChild(stats);
            }

            // 随征标记
            if (item.isFollowUp) {
                const tag = document.createElement('div');
                tag.style.cssText =
                    'position:absolute;bottom:2px;right:4px;font-size:8px;color:#14b8a6;background:rgba(0,0,0,0.6);padding:0 4px;border-radius:3px;';
                tag.textContent = '随征';
                div.appendChild(tag);
            }

            // 锦囊标记
            if (isSpell) {
                const tag = document.createElement('div');
                tag.style.cssText =
                    'position:absolute;top:20px;right:2px;font-size:10px;color:#ec4899;background:rgba(0,0,0,0.6);padding:0 4px;border-radius:3px;';
                tag.textContent = '📜';
                div.appendChild(tag);
            }

            return div;
        }

        function showEmptyState() {
            ['shopGrid', 'handGrid', 'lineupGrid'].forEach(id => {
                document.getElementById(id).innerHTML = '<div class="card-empty">📭 暂无数据</div>';
            });
            document.getElementById('actionDesc').textContent = '📭 请加载数据文件';
            document.getElementById('actionDetails').textContent = '';
            document.getElementById('stepInfo').textContent = '步骤 0 / 0';
        }

        // ============================================================
        // 播放控制
        // ============================================================

        function nextStep() {
            if (!trajectory || trajectory.length === 0) return;
            if (currentStep < trajectory.length - 1) {
                currentStep++;
                renderStep(currentStep);
                updateProgress();
            } else {
                if (isPlaying) togglePlay();
                document.getElementById('actionDesc').textContent = '🏁 已到达最后一步';
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
                updateProgress();
            }
        }

        function togglePlay() {
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                clearInterval(playTimer);
                playTimer = null;
                isPlaying = false;
                btn.textContent = '▶ 播放';
                btn.className = 'btn-play';
            } else {
                if (currentStep >= trajectory.length - 1) {
                    currentStep = 0;
                    renderStep(0);
                    updateProgress();
                }
                isPlaying = true;
                btn.textContent = '⏸ 暂停';
                btn.className = 'btn-pause';
                playTimer = setInterval(() => {
                    if (currentStep < trajectory.length - 1) {
                        currentStep++;
                        renderStep(currentStep);
                        updateProgress();
                    } else {
                        togglePlay();
                        document.getElementById('actionDesc').textContent = '🏁 播放完成';
                    }
                }, playSpeed);
            }
        }

        function resetPlay() {
            if (playTimer) {
                clearInterval(playTimer);
                playTimer = null;
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ 播放';
                document.getElementById('playBtn').className = 'btn-play';
            }
            currentStep = 0;
            if (trajectory && trajectory.length > 0) {
                renderStep(0);
                updateProgress();
            } else {
                showEmptyState();
            }
        }

        function setSpeed(value) {
            playSpeed = parseInt(value);
            if (isPlaying) {
                // 重新设置定时器
                clearInterval(playTimer);
                playTimer = setInterval(() => {
                    if (currentStep < trajectory.length - 1) {
                        currentStep++;
                        renderStep(currentStep);
                        updateProgress();
                    } else {
                        togglePlay();
                    }
                }, playSpeed);
            }
        }

        function updateProgress() {
            if (!trajectory || trajectory.length === 0) {
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressThumb').style.left = '0%';
                return;
            }
            const pct = (currentStep / (trajectory.length - 1)) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressThumb').style.left = pct + '%';
        }

        function clickProgress(e) {
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (trajectory && trajectory.length > 0) {
                currentStep = Math.floor(pct * (trajectory.length - 1));
                currentStep = Math.max(0, Math.min(currentStep, trajectory.length - 1));
                renderStep(currentStep);
                updateProgress();
                if (isPlaying) {
                    // 播放中点击进度条，重置定时器
                    clearInterval(playTimer);
                    playTimer = setInterval(() => {
                        if (currentStep < trajectory.length - 1) {
                            currentStep++;
                            renderStep(currentStep);
                            updateProgress();
                        } else {
                            togglePlay();
                        }
                    }, playSpeed);
                }
            }
        }

        // ============================================================
        // 文件加载（支持拖拽和选择）
        // ============================================================

        function loadFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    loadData(text);
                } catch (err) {
                    console.error('读取文件失败:', err);
                    document.getElementById('actionDesc').textContent = '❌ 读取文件失败: ' + err.message;
                }
            };
            reader.readAsText(file);
        }

        // 拖拽支持
        document.addEventListener('dragover', function(e) {
            e.preventDefault();
        });
        document.addEventListener('drop', function(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.json')) {
                loadFromFile(files[0]);
            } else {
                document.getElementById('actionDesc').textContent = '⚠️ 请拖入 .json 文件';
            }
        });

        // 文件选择按钮
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.json';
        fileInput.style.display = 'none';
        fileInput.onchange = function(e) {
            if (this.files.length > 0) {
                loadFromFile(this.files[0]);
            }
        };
        document.body.appendChild(fileInput);

        // 添加加载按钮到控制栏
        const controls = document.querySelector('.controls');
        const loadBtn = document.createElement('button');
        loadBtn.textContent = '📂 加载数据';
        loadBtn.style.cssText =
            'padding:8px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:#8b5cf6;color:#fff;font-weight:bold;';
        loadBtn.onclick = function() { fileInput.click(); };
        controls.insertBefore(loadBtn, controls.firstChild);

        // ============================================================
        // 键盘快捷键
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch (e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowRight':
                case 'd':
                    e.preventDefault();
                    if (isPlaying) togglePlay();
                    nextStep();
                    break;
                case 'ArrowLeft':
                case 'a':
                    e.preventDefault();
                    if (isPlaying) togglePlay();
                    prevStep();
                    break;
                case 'r':
                    resetPlay();
                    break;
            }
        });

        // ============================================================
        // 初始化
        // ============================================================

        showEmptyState();
        document.getElementById('actionDesc').textContent = '📂 点击"加载数据"按钮或拖入 JSON 文件';
        document.getElementById('fileInfo').textContent = '📂 等待加载...';

        console.log('🎮 自走棋录像回放已启动');
        console.log('⌨️ 快捷键: 空格=播放/暂停, ←/→=上一步/下一步, R=重置');
        console.log('📂 拖入 tavern_segment_*.json 文件加载数据');

        // 尝试从URL参数加载
        const urlParams = new URLSearchParams(window.location.search);
        const dataUrl = urlParams.get('data');
        if (dataUrl) {
            fetch(dataUrl)
                .then(res => res.text())
                .then(text => loadData(text))
                .catch(err => console.error('加载URL数据失败:', err));
        }

        // 暴露全局变量用于调试
        window.__replay = {
            loadData,
            nextStep,
            prevStep,
            togglePlay,
            resetPlay,
            setSpeed,
            getData: () => jsonData,
            getTrajectory: () => trajectory,
            jumpTo: (idx) => { currentStep = Math.max(0, Math.min(idx, trajectory.length - 1));
                renderStep(currentStep);
                updateProgress(); }
        };
    </script>
</body>
</html>
